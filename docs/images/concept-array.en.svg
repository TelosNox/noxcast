<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" width="680" height="212" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; --nf-bat: #e8eefb; --nf-bat-line: #4b6fc4; --nf-card: #ffffff;
  font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; --nf-bat: #1a2747; --nf-bat-line: #7d9ae6;
  --nf-card: #1c1c1c; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .batt { fill: var(--nx-bat, var(--nf-bat)); stroke: var(--nx-bat-line, var(--nf-bat-line)); stroke-width: .6; }
.nx-flow .frame { fill: transparent; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .ph { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .dev { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .dial { fill: var(--nx-card, var(--nf-card)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .needle { stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.nx-flow .north { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.2; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow .add { fill: transparent; stroke: var(--nx-muted, var(--nf-muted)); stroke-width: .8; stroke-dasharray: 4 3; }
.nx-flow [data-node], .nx-flow [data-add], .nx-flow [data-template] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .dis { fill: var(--nx-limit-line, var(--nf-limit-line)); fill-opacity: .3; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect class="pv" x="8" y="8" width="664" height="196" rx="12"/><text x="22" y="26" dominant-baseline="central"><tspan class="t">PV array</tspan><tspan class="s" dx="6">what is measured together</tspan></text><rect class="node" x="24" y="48" width="210" height="40" rx="7"/><text class="t" x="129" y="61" text-anchor="middle" dominant-baseline="central">Modules east · 15° · 1.6 kWp</text><text class="s" x="129" y="77" text-anchor="middle" dominant-baseline="central">orientation</text><rect class="node" x="24" y="100" width="210" height="40" rx="7"/><text class="t" x="129" y="113" text-anchor="middle" dominant-baseline="central">Modules west · 15° · 1.6 kWp</text><text class="s" x="129" y="129" text-anchor="middle" dominant-baseline="central">further orientation</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M234 68 H252"/><rect class="node" x="254" y="48" width="150" height="40" rx="7"/><text class="t" x="329" y="68" text-anchor="middle" dominant-baseline="central">Power sensor 1</text><path class="ln" d="M404 68 H412"/><rect class="lim" x="408" y="58" width="122" height="20" rx="5"/><text class="s" x="469" y="68" text-anchor="middle" dominant-baseline="central">per sensor ≤ 800 W</text><path class="ln" d="M530 68 H544 V94"/><path class="ln" marker-end="url(#nx-c-arrow)" d="M234 120 H252"/><rect class="node" x="254" y="100" width="150" height="40" rx="7"/><text class="t" x="329" y="120" text-anchor="middle" dominant-baseline="central">Power sensor 2</text><path class="ln" d="M404 120 H412"/><rect class="lim" x="408" y="110" width="122" height="20" rx="5"/><text class="s" x="469" y="120" text-anchor="middle" dominant-baseline="central">per sensor ≤ 800 W</text><path class="ln" d="M530 120 H544 V94"/><rect class="node" x="546" y="78" width="32" height="32" rx="7"/><text class="t" x="562" y="94" text-anchor="middle" dominant-baseline="central">Σ</text><text class="s" x="562" y="122" text-anchor="middle" dominant-baseline="central">sum</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M578 94 H600"/><text class="s" x="636" y="88" text-anchor="middle" dominant-baseline="central">to</text><text class="s" x="636" y="102" text-anchor="middle" dominant-baseline="central">the system</text><text class="s" x="340" y="154" text-anchor="middle" dominant-baseline="central">One PV array per unit that is measured together (MPPT input, inverter).</text><text class="s" x="340" y="168" text-anchor="middle" dominant-baseline="central">Several sensors are summed; modules facing another way on the same sensor are</text><text class="s" x="340" y="182" text-anchor="middle" dominant-baseline="central">a further orientation. The limit per sensor holds when it stays flat at a maximum.</text></svg>
