<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 186" width="680" height="186" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .frame { fill: none; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow [data-node] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .dis { fill: var(--nx-limit-line, var(--nf-limit-line)); fill-opacity: .3; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect class="pv" x="16" y="40" width="108" height="40" rx="7"/><text class="t" x="70" y="60" text-anchor="middle" dominant-baseline="central">PV-Gruppe</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M124 60 H194"/><rect class="lim" x="78" y="14" width="165" height="20" rx="5"/><text class="s" x="160" y="24" text-anchor="middle" dominant-baseline="central">Leistungsgrenze je Sensor</text><path class="ln" d="M160.0 34 V58" stroke-dasharray="2 2"/><text class="s" x="160" y="100" text-anchor="middle" dominant-baseline="central">MPPT-Eingang oder Mikro-WR</text><text class="s" x="160" y="114" text-anchor="middle" dominant-baseline="central">lässt höchstens so viel</text><text class="s" x="160" y="128" text-anchor="middle" dominant-baseline="central">durch</text><rect class="sys" x="196" y="40" width="108" height="40" rx="7"/><text class="t" x="250" y="60" text-anchor="middle" dominant-baseline="central">System</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M304 60 H374"/><rect class="lim" x="292" y="14" width="97" height="20" rx="5"/><text class="s" x="340" y="24" text-anchor="middle" dominant-baseline="central">Ausgangsgrenze</text><path class="ln" d="M340.0 34 V58" stroke-dasharray="2 2"/><text class="s" x="340" y="100" text-anchor="middle" dominant-baseline="central">was das System höchstens</text><text class="s" x="340" y="114" text-anchor="middle" dominant-baseline="central">abgibt; sein Akku nimmt</text><text class="s" x="340" y="128" text-anchor="middle" dominant-baseline="central">mehr auf, bis er voll ist</text><rect class="node" x="376" y="40" width="108" height="40" rx="7"/><text class="t" x="430" y="60" text-anchor="middle" dominant-baseline="central">Haus</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M484 60 H554"/><rect class="lim" x="465" y="14" width="109" height="20" rx="5"/><text class="s" x="520" y="24" text-anchor="middle" dominant-baseline="central">Einspeisevorgabe</text><path class="ln" d="M520.0 34 V58" stroke-dasharray="2 2"/><text class="s" x="520" y="100" text-anchor="middle" dominant-baseline="central">was ins Netz darf; der Rest</text><text class="s" x="520" y="114" text-anchor="middle" dominant-baseline="central">deckt das Haus oder wird</text><text class="s" x="520" y="128" text-anchor="middle" dominant-baseline="central">abgeregelt</text><rect class="node" x="556" y="40" width="108" height="40" rx="7"/><text class="t" x="610" y="60" text-anchor="middle" dominant-baseline="central">Netz</text><text class="s" x="340" y="170" text-anchor="middle" dominant-baseline="central">Mit Teilsystemen gilt jede Grenze – die engere zählt.</text></svg>
