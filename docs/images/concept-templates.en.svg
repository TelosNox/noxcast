<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 242" width="680" height="242" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; --nf-bat: #e8eefb; --nf-bat-line: #4b6fc4; --nf-card: #ffffff;
  font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; --nf-bat: #1a2747; --nf-bat-line: #7d9ae6;
  --nf-card: #1c1c1c; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .batt { fill: var(--nx-bat, var(--nf-bat)); stroke: var(--nx-bat-line, var(--nf-bat-line)); stroke-width: .6; }
.nx-flow .frame { fill: transparent; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .ph { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .dev { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .dial { fill: var(--nx-card, var(--nf-card)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .needle { stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.nx-flow .north { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.2; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow .add { fill: transparent; stroke: var(--nx-muted, var(--nf-muted)); stroke-width: .8; stroke-dasharray: 4 3; }
.nx-flow [data-node], .nx-flow [data-add], .nx-flow [data-template] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .dis { fill: var(--nx-limit-line, var(--nf-limit-line)); fill-opacity: .3; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g data-template="inverter"><rect class="node" x="8" y="8" width="160" height="226" rx="10"/><text class="t" x="88" y="26" text-anchor="middle" dominant-baseline="central">Inverter</text><text class="t" x="88" y="42" text-anchor="middle" dominant-baseline="central">without battery</text><text class="s" x="88" y="200" text-anchor="middle" dominant-baseline="central">micro or string inverter,</text><text class="s" x="88" y="214" text-anchor="middle" dominant-baseline="central">older roof installation</text><rect class="pv" x="38" y="60" width="100" height="26" rx="7"/><text class="t" x="88" y="73" text-anchor="middle" dominant-baseline="central">PV</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M88 86 V102"/><rect class="sys" x="38" y="104" width="100" height="34" rx="7"/><text class="t" x="88" y="121" text-anchor="middle" dominant-baseline="central">Inverter</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M88 138 V158"/><rect class="node" x="48" y="160" width="80" height="24" rx="7"/><text class="t" x="88" y="172" text-anchor="middle" dominant-baseline="central">House</text></g><g data-template="pv_battery"><rect class="node" x="176" y="8" width="160" height="226" rx="10"/><text class="t" x="256" y="26" text-anchor="middle" dominant-baseline="central">PV with battery</text><text class="t" x="256" y="42" text-anchor="middle" dominant-baseline="central">in one device</text><text class="s" x="256" y="200" text-anchor="middle" dominant-baseline="central">balcony device with</text><text class="s" x="256" y="214" text-anchor="middle" dominant-baseline="central">battery, hybrid inverter</text><rect class="pv" x="206" y="60" width="100" height="26" rx="7"/><text class="t" x="256" y="73" text-anchor="middle" dominant-baseline="central">PV</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M256 86 V102"/><rect class="sys" x="196" y="104" width="120" height="34" rx="7"/><text class="t" x="256" y="114" text-anchor="middle" dominant-baseline="central">Device</text><text class="s" x="256" y="130" text-anchor="middle" dominant-baseline="central">Battery</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M256 138 V158"/><rect class="node" x="216" y="160" width="80" height="24" rx="7"/><text class="t" x="256" y="172" text-anchor="middle" dominant-baseline="central">House</text></g><g data-template="ac_battery"><rect class="node" x="344" y="8" width="160" height="226" rx="10"/><text class="t" x="424" y="26" text-anchor="middle" dominant-baseline="central">Battery at the</text><text class="t" x="424" y="42" text-anchor="middle" dominant-baseline="central">house grid</text><text class="s" x="424" y="200" text-anchor="middle" dominant-baseline="central">plug-in battery with</text><text class="s" x="424" y="214" text-anchor="middle" dominant-baseline="central">own inverter, no PV</text><text class="s" x="424" y="76" text-anchor="middle" dominant-baseline="central">charges from the house</text><rect class="sys" x="374" y="104" width="100" height="34" rx="7"/><text class="t" x="424" y="121" text-anchor="middle" dominant-baseline="central">Battery + inv.</text><path class="ln" marker-end="url(#nx-c-arrow)" marker-start="url(#nx-c-arrow)" d="M424 138 V156"/><rect class="node" x="384" y="160" width="80" height="24" rx="7"/><text class="t" x="424" y="172" text-anchor="middle" dominant-baseline="central">House</text></g><g data-template="coupled"><rect class="node" x="512" y="8" width="160" height="226" rx="10"/><text class="t" x="592" y="26" text-anchor="middle" dominant-baseline="central">Coupled</text><text class="t" x="592" y="42" text-anchor="middle" dominant-baseline="central">systems</text><text class="s" x="592" y="200" text-anchor="middle" dominant-baseline="central">devices with one</text><text class="s" x="592" y="214" text-anchor="middle" dominant-baseline="central">control, e.g. Stream</text><rect class="pv" x="522" y="60" width="64" height="26" rx="7"/><text class="t" x="554" y="73" text-anchor="middle" dominant-baseline="central">PV</text><rect class="pv" x="598" y="60" width="64" height="26" rx="7"/><text class="t" x="630" y="73" text-anchor="middle" dominant-baseline="central">PV</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M554 86 V104"/><path class="ln" marker-end="url(#nx-c-arrow)" d="M630 86 V104"/><rect class="sys" x="516" y="98" width="152" height="46" rx="7"/><rect class="node" x="522" y="106" width="64" height="30" rx="7"/><text class="t" x="554" y="121" text-anchor="middle" dominant-baseline="central">Device</text><rect class="node" x="598" y="106" width="64" height="30" rx="7"/><text class="t" x="630" y="121" text-anchor="middle" dominant-baseline="central">Device</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M592 144 V158"/><rect class="node" x="552" y="160" width="80" height="24" rx="7"/><text class="t" x="592" y="172" text-anchor="middle" dominant-baseline="central">House</text></g></svg>
