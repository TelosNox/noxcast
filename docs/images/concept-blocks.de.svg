<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="680" height="346" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; --nf-bat: #e8eefb; --nf-bat-line: #4b6fc4; --nf-card: #ffffff;
  font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; --nf-bat: #1a2747; --nf-bat-line: #7d9ae6;
  --nf-card: #1c1c1c; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .batt { fill: var(--nx-bat, var(--nf-bat)); stroke: var(--nx-bat-line, var(--nf-bat-line)); stroke-width: .6; }
.nx-flow .frame { fill: transparent; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .ph { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .dev { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .dial { fill: var(--nx-card, var(--nf-card)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .needle { stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: 1.8; stroke-linecap: round; fill: none; }
.nx-flow .north { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.2; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow [data-node] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .dis { fill: var(--nx-limit-line, var(--nf-limit-line)); fill-opacity: .3; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect class="frame" x="8" y="8" width="580" height="330" rx="12"/><text x="22" y="26" dominant-baseline="central"><tspan class="t">Haushalt</tspan><tspan class="s" dx="6">Hausverbrauch, Netz, Einspeisevorgabe</tspan></text><rect class="sys" x="24" y="46" width="418" height="70" rx="7"/><text x="36" y="62" dominant-baseline="central"><tspan class="t">System</tspan><tspan class="s" dx="6">Wechselrichter ohne Akku</tspan></text><rect class="pv" x="36" y="76" width="120" height="30" rx="7"/><text class="t" x="96" y="91" text-anchor="middle" dominant-baseline="central">PV-Gruppe Süd</text><rect class="pv" x="164" y="76" width="120" height="30" rx="7"/><text class="t" x="224" y="91" text-anchor="middle" dominant-baseline="central">PV-Gruppe West</text><rect class="lim" x="335" y="81" width="97" height="20" rx="5"/><text class="s" x="384" y="91" text-anchor="middle" dominant-baseline="central">Ausgangsgrenze</text><rect class="sys" x="24" y="126" width="418" height="70" rx="7"/><text x="36" y="142" dominant-baseline="central"><tspan class="t">System</tspan><tspan class="s" dx="6">PV mit Akku in einem Gerät</tspan></text><rect class="pv" x="36" y="156" width="120" height="30" rx="7"/><text class="t" x="96" y="171" text-anchor="middle" dominant-baseline="central">PV-Gruppe</text><rect class="node" x="164" y="156" width="90" height="30" rx="7"/><text class="t" x="209" y="171" text-anchor="middle" dominant-baseline="central">Akku</text><rect class="sys" x="24" y="206" width="418" height="120" rx="7"/><text x="36" y="222" dominant-baseline="central"><tspan class="t">System</tspan><tspan class="s" dx="6">Gekoppelte Systeme, z. B. EcoFlow Stream</tspan></text><rect class="lim" x="317" y="212" width="115" height="20" rx="5"/><text class="s" x="374" y="222" text-anchor="middle" dominant-baseline="central">gemeinsame Grenze</text><rect class="node" x="36" y="240" width="194" height="76" rx="7"/><text x="46" y="255" dominant-baseline="central"><tspan class="t">Teilsystem</tspan><tspan class="s" dx="6">1</tspan></text><rect class="pv" x="46" y="272" width="96" height="30" rx="7"/><text class="t" x="94" y="287" text-anchor="middle" dominant-baseline="central">Ost</text><rect class="node" x="150" y="272" width="70" height="30" rx="7"/><text class="t" x="185" y="287" text-anchor="middle" dominant-baseline="central">Akku</text><rect class="node" x="238" y="240" width="194" height="76" rx="7"/><text x="248" y="255" dominant-baseline="central"><tspan class="t">Teilsystem</tspan><tspan class="s" dx="6">2</tspan></text><rect class="pv" x="248" y="272" width="96" height="30" rx="7"/><text class="t" x="296" y="287" text-anchor="middle" dominant-baseline="central">West</text><rect class="node" x="352" y="272" width="70" height="30" rx="7"/><text class="t" x="387" y="287" text-anchor="middle" dominant-baseline="central">Akku</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M442 81 H460 V170 H478"/><path class="ln" marker-end="url(#nx-c-arrow)" d="M442 161 H478"/><path class="ln" d="M442 266 H460 V170"/><rect class="node" x="480" y="148" width="92" height="44" rx="7"/><text class="t" x="526" y="170" text-anchor="middle" dominant-baseline="central">Haus</text><rect class="node" x="604" y="148" width="68" height="44" rx="7"/><text class="t" x="638" y="170" text-anchor="middle" dominant-baseline="central">Netz</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M572 170 H602"/><text class="s" x="626" y="204" text-anchor="middle" dominant-baseline="central">Einspeisevorgabe</text></svg>
