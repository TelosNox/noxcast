name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]    # edited: a waiver in the description counts at once

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/check_changelog.py "$BASE"
