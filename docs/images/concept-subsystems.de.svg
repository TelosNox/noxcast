<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" width="680" height="212" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .frame { fill: none; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow [data-node] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect class="sys" x="8" y="8" width="448" height="196" rx="7"/><text x="22" y="26" dominant-baseline="central"><tspan class="t">Gekoppelte Systeme</tspan><tspan class="s" dx="6">eine Steuerung regelt alle Teilsysteme</tspan></text><rect class="lim" x="331" y="176" width="115" height="20" rx="5"/><text class="s" x="388" y="186" text-anchor="middle" dominant-baseline="central">gemeinsame Grenze</text><rect class="node" x="22" y="48" width="202" height="104" rx="7"/><text x="32" y="64" dominant-baseline="central"><tspan class="t">Teilsystem 1</tspan><tspan class="s" dx="6"></tspan></text><rect class="lim" x="125" y="54" width="91" height="20" rx="5"/><text class="s" x="171" y="64" text-anchor="middle" dominant-baseline="central">eigene Grenze</text><rect class="pv" x="32" y="82" width="96" height="30" rx="7"/><text class="t" x="80" y="97" text-anchor="middle" dominant-baseline="central">PV-Gruppe</text><rect class="node" x="136" y="82" width="78" height="30" rx="7"/><text class="t" x="175" y="97" text-anchor="middle" dominant-baseline="central">Akku</text><rect class="node" x="240" y="48" width="202" height="104" rx="7"/><text x="250" y="64" dominant-baseline="central"><tspan class="t">Teilsystem 2</tspan><tspan class="s" dx="6"></tspan></text><rect class="lim" x="343" y="54" width="91" height="20" rx="5"/><text class="s" x="389" y="64" text-anchor="middle" dominant-baseline="central">eigene Grenze</text><text class="s" x="300" y="97" text-anchor="middle" dominant-baseline="central">lädt aus dem Haus</text><rect class="node" x="354" y="82" width="78" height="30" rx="7"/><text class="t" x="393" y="97" text-anchor="middle" dominant-baseline="central">Akku</text><path class="ln" marker-start="url(#nx-c-arrow)" marker-end="url(#nx-c-arrow)" d="M216 126 V136 H392 V114"/><text class="s" x="304" y="146" text-anchor="middle" dominant-baseline="central">gleichen sich aus</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M456 106 H496"/><rect class="node" x="498" y="84" width="80" height="44" rx="7"/><text class="t" x="538" y="106" text-anchor="middle" dominant-baseline="central">Haus</text><text class="s" x="500" y="156" text-anchor="start" dominant-baseline="central">Vom System: Regelung,</text><text class="s" x="500" y="170" text-anchor="start" dominant-baseline="central">Einspeisung, gemeinsame Grenze,</text><text class="s" x="500" y="184" text-anchor="start" dominant-baseline="central">Ausgleich der Akkus</text><text class="s" x="22" y="172" text-anchor="start" dominant-baseline="central">Je Teilsystem: eigene Grenze,</text><text class="s" x="22" y="186" text-anchor="start" dominant-baseline="central">Phase, PV-Gruppen, ein Akku</text></svg>
