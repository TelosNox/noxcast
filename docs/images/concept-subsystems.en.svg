<svg class="nx-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 212" width="680" height="212" role="img"><style>
svg.nx-flow { --nf-text: #1f1f1f; --nf-muted: #666; --nf-line: #8a8a8a; --nf-node: #f6f6f6; --nf-frame: #9a9a9a;
  --nf-pv: #fbf1df; --nf-pv-line: #c98a12; --nf-sys: #e3f4ee; --nf-sys-line: #2e9e7b; --nf-limit: #fae8e2;
  --nf-limit-line: #d0603a; font-family: var(--nx-font, Roboto, "Segoe UI", sans-serif); }
@media (prefers-color-scheme: dark) { svg.nx-flow { --nf-text: #ececec; --nf-muted: #a8a8a8; --nf-line: #8f8f8f;
  --nf-node: #2a2a2a; --nf-frame: #777; --nf-pv: #3d2f16; --nf-pv-line: #e0a43c; --nf-sys: #15362c;
  --nf-sys-line: #4cc7a0; --nf-limit: #43231a; --nf-limit-line: #e88a68; } }
.nx-flow .t { fill: var(--nx-text, var(--nf-text)); font-size: 13px; font-weight: 500; }
.nx-flow .s { fill: var(--nx-muted, var(--nf-muted)); font-size: 11px; }
.nx-flow .ln { stroke: var(--nx-line, var(--nf-line)); stroke-width: 1.4; fill: none; }
.nx-flow .node { fill: var(--nx-node, var(--nf-node)); stroke: var(--nx-line, var(--nf-line)); stroke-width: .6; }
.nx-flow .pv { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .6; }
.nx-flow .sys { fill: var(--nx-sys, var(--nf-sys)); stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: .6; }
.nx-flow .frame { fill: none; stroke: var(--nx-frame, var(--nf-frame)); stroke-width: .8; stroke-dasharray: 5 4; }
.nx-flow .lim { fill: var(--nx-limit, var(--nf-limit)); stroke: var(--nx-limit-line, var(--nf-limit-line)); stroke-width: .6; }
.nx-flow .exact { fill: #3f9b4f; } .nx-flow .simplified { fill: #c98a12; } .nx-flow .not_yet { fill: #8a8f98; }
.nx-flow [data-node] { cursor: pointer; }
</style><style>
.nx-flow .out { stroke: var(--nx-sys-line, var(--nf-sys-line)); stroke-width: 2.2; fill: none; }
.nx-flow .load { stroke: var(--nx-muted, var(--nf-muted)); stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
.nx-flow .bat { fill: var(--nx-sys-line, var(--nf-sys-line)); fill-opacity: .28; stroke: none; }
.nx-flow .dis { fill: var(--nx-limit-line, var(--nf-limit-line)); fill-opacity: .3; stroke: none; }
.nx-flow .pva { fill: var(--nx-pv, var(--nf-pv)); stroke: var(--nx-pv-line, var(--nf-pv-line)); stroke-width: .8; }
.nx-flow .h { fill: var(--nx-text, var(--nf-text)); font-size: 14px; font-weight: 600; }
</style><defs><marker id="nx-c-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect class="sys" x="8" y="8" width="448" height="196" rx="7"/><text x="22" y="26" dominant-baseline="central"><tspan class="t">Coupled systems</tspan><tspan class="s" dx="6">one control regulates all subsystems</tspan></text><rect class="lim" x="362" y="176" width="84" height="20" rx="5"/><text class="s" x="404" y="186" text-anchor="middle" dominant-baseline="central">shared limit</text><rect class="node" x="22" y="48" width="202" height="104" rx="7"/><text x="32" y="64" dominant-baseline="central"><tspan class="t">Subsystem 1</tspan><tspan class="s" dx="6"></tspan></text><rect class="lim" x="150" y="54" width="66" height="20" rx="5"/><text class="s" x="183" y="64" text-anchor="middle" dominant-baseline="central">own limit</text><rect class="pv" x="32" y="82" width="96" height="30" rx="7"/><text class="t" x="80" y="97" text-anchor="middle" dominant-baseline="central">PV array</text><rect class="node" x="136" y="82" width="78" height="30" rx="7"/><text class="t" x="175" y="97" text-anchor="middle" dominant-baseline="central">Battery</text><rect class="node" x="240" y="48" width="202" height="104" rx="7"/><text x="250" y="64" dominant-baseline="central"><tspan class="t">Subsystem 2</tspan><tspan class="s" dx="6"></tspan></text><rect class="lim" x="368" y="54" width="66" height="20" rx="5"/><text class="s" x="401" y="64" text-anchor="middle" dominant-baseline="central">own limit</text><text class="s" x="294" y="90" text-anchor="middle" dominant-baseline="central">charges from</text><text class="s" x="294" y="104" text-anchor="middle" dominant-baseline="central">the house</text><rect class="node" x="354" y="82" width="78" height="30" rx="7"/><text class="t" x="393" y="97" text-anchor="middle" dominant-baseline="central">Battery</text><path class="ln" marker-start="url(#nx-c-arrow)" marker-end="url(#nx-c-arrow)" d="M175 114 V136 H393 V114"/><text class="s" x="304" y="146" text-anchor="middle" dominant-baseline="central">balance each other</text><path class="ln" marker-end="url(#nx-c-arrow)" d="M456 106 H496"/><rect class="node" x="498" y="84" width="80" height="44" rx="7"/><text class="t" x="538" y="106" text-anchor="middle" dominant-baseline="central">House</text><text class="s" x="486" y="156" text-anchor="start" dominant-baseline="central">From the system: regulation,</text><text class="s" x="486" y="170" text-anchor="start" dominant-baseline="central">feed-in, shared limit,</text><text class="s" x="486" y="184" text-anchor="start" dominant-baseline="central">batteries balancing</text><text class="s" x="22" y="172" text-anchor="start" dominant-baseline="central">Per subsystem: own limit,</text><text class="s" x="22" y="186" text-anchor="start" dominant-baseline="central">phase, PV arrays, one battery</text></svg>
