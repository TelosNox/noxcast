name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"      # weekly, for tests-latest: a new Home Assistant arrives without a commit here
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:                      # the oldest supported Home Assistant, as pinned in requirements_test.txt and named in hacs.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  tests-latest:               # the newest Home Assistant; not required, an early warning of what it breaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pip install --upgrade pytest-homeassistant-custom-component
      - run: python .github/scripts/check_latest_ha.py
      - run: pytest -q

  report-latest:              # a failed weekly run is only a mail otherwise; an issue stays until someone deals with it
    needs: tests-latest
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "The newest Home Assistant fails the tests"
    steps:
      - run: |
          if [ -z "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$TITLE" --body "The weekly \`tests-latest\` job failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - run: ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
